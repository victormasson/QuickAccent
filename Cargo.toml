[package]
name = "quickaccent"
version = "0.1.0"
edition = "2021"
description = "Cross-platform accent character picker inspired by PowerToys PowerAccent"
license = "MIT"
repository = "https://github.com/victormasson/QuickAccent"
readme = "README.md"

[[bin]]
name = "quickaccent"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio"] }
enigo = "0.6.1"
tokio = { version = "1", features = ["sync"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
notify = "8"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
cocoa = "0.26"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6.1", features = ["wayland", "libei_tokio"] }
rdev = { version = "0.5", features = ["unstable_grab"] }
xkbcommon = "0.9"
